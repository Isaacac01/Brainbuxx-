document.addEventListener('DOMContentLoaded', () => {
    const launchScreen = document.getElementById('launchScreen');
    if (!launchScreen) return;

    const launchName = document.getElementById('launchName');
    const launchSubtitle = document.getElementById('launchSubtitle');
    const launchTagline = document.getElementById('launchTagline');

    if (launchName) {
        const text = 'BrainBuxx';
        launchName.innerHTML = '';
        [...text].forEach((char, index) => {
            const span = document.createElement('span');
            span.className = 'letter';
            span.style.animationDelay = `${0.3 + index * 0.14}s`;
            span.textContent = char;
            launchName.appendChild(span);
        });
    }

    if (launchSubtitle) {
        launchSubtitle.textContent = 'An intelligent companion for ideas, knowledge and innovation.';
    }

    if (launchTagline) {
        launchTagline.textContent = 'Developed by VHS Science and Innovation';
    }

    setTimeout(() => {
        launchScreen.classList.add('hidden');
    }, 4300);
});
